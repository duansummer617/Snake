<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#060a07" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="贪吃蛇" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png" />
<title>像素贪吃蛇</title>
<style>
  :root {
    --bg: #060a07;
    --panel: #0b1310;
    --line: #1d3026;
    --neon: #3dff6e;
    --neon-2: #22c24e;
    --food: #ff2e4d;
    --bonus: #ffd93d;
    --text: #b6d6c1;
    --text-dim: #587a65;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--text);
    font-family: ui-monospace, "SFMono-Regular", "Cascadia Mono", Consolas, monospace;
    user-select: none; -webkit-user-select: none;
    touch-action: none; overscroll-behavior: none;
  }
  .app {
    height: 100%; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px;
    padding: max(12px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom));
  }
  .hud {
    width: min(94vw, 380px); display: grid; grid-template-columns: 1fr auto 1fr;
    align-items: flex-end; gap: 10px;
    padding-bottom: 2px; border-bottom: 1px solid var(--line);
  }
  .stat-group { display: flex; gap: 14px; justify-self: end; }
  .stat { display: flex; flex-direction: column; gap: 5px; }
  .stat .label { font-size: 10px; letter-spacing: 3px; color: var(--text-dim); }
  .stat .value {
    font-size: 28px; font-weight: 700; line-height: 1; color: var(--neon);
    text-shadow: 0 0 12px rgba(61, 255, 110, 0.45);
  }
  .stat.right { text-align: right; }
  .stat.mid { align-items: center; text-align: center; }
  .stat.mid .value { font-size: 20px; color: var(--text-dim); text-shadow: none; }
  .stat.mid .value.is-on { color: var(--bonus); text-shadow: 0 0 12px rgba(255, 217, 61, 0.55); }
  .stat-group .value { font-size: 20px; text-shadow: 0 0 10px rgba(61, 255, 110, 0.35); }
  .stat-group .stat:first-child .value { color: var(--text); text-shadow: 0 0 10px rgba(61, 255, 110, 0.25); }
  .stage { position: relative; will-change: transform; }
  .stage.shake { animation: shake 0.32s steps(2, end); }
  @keyframes shake {
    0% { transform: translate(0, 0); }
    30% { transform: translate(-4px, 3px); }
    60% { transform: translate(4px, -2px); }
    100% { transform: translate(0, 0); }
  }
  canvas {
    display: block; width: min(94vw, 44vh, 380px); height: auto;
    image-rendering: pixelated; image-rendering: crisp-edges;
    border: 1px solid var(--line); background: var(--bg);
    box-shadow: 0 0 0 1px rgba(61, 255, 110, 0.06), 0 0 26px rgba(61, 255, 110, 0.10);
  }
  .hint { margin: 0; font-size: 11px; letter-spacing: 1px; color: var(--text-dim); }
  .pad { width: min(66vw, 36vh, 290px); aspect-ratio: 1; touch-action: none; }
  .ring { display: block; width: 100%; height: 100%; }
  .ring .sec {
    fill: rgba(61, 255, 110, 0.05); stroke: var(--line); stroke-width: 1.5;
    cursor: pointer; transition: fill 0.06s, stroke 0.06s;
  }
  .ring .sec.is-down {
    fill: rgba(61, 255, 110, 0.24); stroke: var(--neon);
    filter: drop-shadow(0 0 7px rgba(61, 255, 110, 0.55));
  }
  .ring .arrow { fill: var(--neon); opacity: 0.72; pointer-events: none; }
  .ring .sec.is-down + .arrow { opacity: 1; }
  .ring .hub { fill: none; stroke: var(--line); stroke-width: 1; pointer-events: none; }
  .ring .hub-dot { fill: var(--neon); opacity: 0.28; pointer-events: none; }
  .overlay {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(3, 6, 4, 0.86); z-index: 20; padding: 24px;
  }
  .overlay.is-open { display: flex; }
  .panel { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 14px; }
  .title {
    margin: 0; font-size: 30px; letter-spacing: 8px; color: var(--neon);
    text-shadow: 0 0 18px rgba(61, 255, 110, 0.55), 3px 3px 0 rgba(34, 194, 78, 0.35);
  }
  .tip { margin: 0; font-size: 12px; line-height: 1.9; color: var(--text-dim); letter-spacing: 1px; }
  .tip.small { font-size: 10px; letter-spacing: 0.5px; color: #4d7a5f; max-width: 250px; }
  .tip b { color: var(--text); font-weight: 400; }
  .scoreline { display: flex; gap: 22px; font-size: 12px; letter-spacing: 2px; color: var(--text-dim); }
  .scoreline span b { color: var(--neon); font-size: 20px; margin-left: 6px; }
  .diffbox { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .diff { display: flex; gap: 6px; padding: 4px; border: 1px solid var(--line); border-radius: 3px; }
  .diff-opt {
    font: inherit; font-size: 12px; letter-spacing: 3px; padding: 9px 22px; cursor: pointer;
    color: var(--text-dim); background: transparent; border: 0; border-radius: 2px;
    transition: color 0.1s, background 0.1s;
  }
  .diff-opt.is-active {
    color: #04150a; background: var(--neon); box-shadow: 0 0 14px rgba(61, 255, 110, 0.35);
  }
  .badge {
    font-size: 10px; letter-spacing: 3px; padding: 4px 10px; color: #04150a;
    background: var(--neon); box-shadow: 0 0 16px rgba(61, 255, 110, 0.5);
  }
  .btn {
    margin-top: 4px; padding: 14px 36px; font: inherit; font-size: 15px; letter-spacing: 5px;
    color: #04150a; background: var(--neon); border: 0; border-radius: 2px; cursor: pointer;
    box-shadow: 0 0 22px rgba(61, 255, 110, 0.45);
  }
  .btn:active { transform: translateY(1px); box-shadow: 0 0 8px rgba(61, 255, 110, 0.5); }
  .flash {
    position: fixed; inset: 0; background: rgba(255, 46, 77, 0.18);
    opacity: 0; pointer-events: none; z-index: 15;
  }
  .flash.on { animation: flash 0.38s ease-out; }
  @keyframes flash { 0% { opacity: 1; } 100% { opacity: 0; } }
</style>
</head>
<body>
<div class="app">
  <header class="hud">
    <div class="stat"><span class="label">SCORE</span><span class="value" id="score">0</span></div>
    <div class="stat mid"><span class="label">奖励</span><span class="value" id="timer">--</span></div>
    <div class="stat-group">
      <div class="stat right"><span class="label" id="lvLabel">普通 · LV</span><span class="value" id="lv">1</span></div>
      <div class="stat right"><span class="label">BEST</span><span class="value" id="best">0</span></div>
    </div>
  </header>
  <main class="stage">
    <canvas id="board" width="320" height="320"></canvas>
  </main>
  <p class="hint">红果 +1 分 · 限时黄块 +5 分 · 点棋盘暂停</p>
  <nav class="pad" aria-label="方向控制">
    <svg class="ring" id="ring" viewBox="0 0 200 200" role="group" aria-label="环形方向键"></svg>
  </nav>
</div>

<div class="flash" id="flash"></div>

<div class="overlay is-open" id="overlay">
  <div class="panel">
    <h1 class="title" id="ovTitle">贪吃蛇</h1>
    <p class="tip" id="ovTip">撞墙即死 · 吃到食物变长并<b>加速</b><br />点棋盘暂停 · 环形键 / 滑动 / 方向键</p>
    <div class="diffbox" id="diffBox">
      <div class="diff" role="group" aria-label="难度选择">
        <button class="diff-opt" type="button" data-diff="normal">普通</button>
        <button class="diff-opt" type="button" data-diff="hard">困难</button>
      </div>
      <p class="tip small" id="diffDesc"></p>
    </div>
    <div class="scoreline" id="ovScores" hidden>
      <span>本局<b id="ovScore">0</b></span>
      <span>最高<b id="ovBest">0</b></span>
    </div>
    <div class="badge" id="ovBadge" hidden>新纪录</div>
    <button class="btn" id="ovBtn">开始游戏</button>
    <p class="tip small" id="ovInstall">浏览器菜单 →「安装应用」或「添加到主屏幕」，即可离线全屏游玩</p>
  </div>
</div>

<script>
(function () {
  'use strict';

  var COLS = 22, ROWS = 22, CELL = 16;
  // 提速档位：累计 8 / 6 / 4 / 3 / 2 / 2 / 1 分升一级，之后每 1 分升一级
  var TIER_GAPS = [8, 6, 4, 3, 2, 2, 1];
  var BONUS_KEY = 'snake.best.v2';        // { normal: n, hard: n } 分难度最高分
  var STORE_KEY = 'snake.best.v1';         // 旧版单值最高分，读到时迁移到普通难度
  var DIFF_KEY = 'snake.diff.v1';
  var BONUS_EVERY = 3;                     // 每吃 3 个红果刷一次奖励果
  var BONUS_TTL_BASE = 10;                 // 奖励果基础存活秒数
  var BONUS_TTL_MIN = 4;                   // 最快难度下的最短存活秒数

  var DIFFS = {
    normal: {
      key: 'normal', label: '普通', base: 150, step: 7, min: 66, len: 3, obstacles: 0,
      desc: '起步 150ms/格 · 每级 -7ms · 初始 3 节'
    },
    hard: {
      key: 'hard', label: '困难', base: 118, step: 9, min: 50, len: 5, obstacles: 8,
      desc: '起步 118ms/格 · 每级 -9ms · 初始 5 节 · 每 6 分长出一个障碍'
    }
  };

  var canvas = document.getElementById('board');
  var ctx = canvas.getContext('2d');
  canvas.width = COLS * CELL;
  canvas.height = ROWS * CELL;

  var elScore = document.getElementById('score');
  var elBest = document.getElementById('best');
  var elLv = document.getElementById('lv');
  var elLvLabel = document.getElementById('lvLabel');
  var elTimer = document.getElementById('timer');
  var diffBox = document.getElementById('diffBox');
  var diffDesc = document.getElementById('diffDesc');
  var overlay = document.getElementById('overlay');
  var ovTitle = document.getElementById('ovTitle');
  var ovTip = document.getElementById('ovTip');
  var ovScores = document.getElementById('ovScores');
  var ovScore = document.getElementById('ovScore');
  var ovBest = document.getElementById('ovBest');
  var ovBadge = document.getElementById('ovBadge');
  var ovBtn = document.getElementById('ovBtn');
  var ovInstall = document.getElementById('ovInstall');
  var flash = document.getElementById('flash');
  var stage = document.querySelector('.stage');

  var snake, dir, queue, food, score, tick, alive, running, best, eaten, bonus;
  var obstacles = [];
  var diff = loadDiff();
  var overlayMode = 'start';
  var bests, bestAtStart = 0, newRecord = false, timerText = '';

  bests = loadBests();
  best = bestFor(diff);

  function loadBests() {
    try {
      var raw = localStorage.getItem(BONUS_KEY);
      if (raw) {
        var o = JSON.parse(raw);
        if (o && typeof o === 'object') return o;
      }
      var old = parseInt(localStorage.getItem(STORE_KEY) || '0', 10) || 0;
      if (old > 0) {
        var migrated = { normal: old, hard: 0 };
        localStorage.setItem(BONUS_KEY, JSON.stringify(migrated));
        return migrated;
      }
    } catch (e) { /* 隐私模式下忽略 */ }
    return { normal: 0, hard: 0 };
  }
  function saveBests() {
    try { localStorage.setItem(BONUS_KEY, JSON.stringify(bests)); } catch (e) { /* 忽略 */ }
  }
  function bestFor(k) {
    return bests && bests[k] ? bests[k] : 0;
  }
  function submitScore() {
    if (score > bestFor(diff)) {
      bests[diff] = score;
      saveBests();
      best = score;
    }
  }

  function reset() {
    var cfg = DIFFS[diff], i;
    snake = [];
    for (i = 0; i < cfg.len; i++) snake.push({ x: 8 - i, y: 11 });
    dir = { x: 1, y: 0 };
    queue = [];
    obstacles = [];
    score = 0;
    eaten = 0;
    bonus = null;
    newRecord = false;
    bestAtStart = bestFor(diff);
    best = bestAtStart;
    tick = tickFor(0);
    alive = true;
    placeFood();
    syncHud();
  }

  function placeFood() {
    var free = [], x, y;
    for (y = 0; y < ROWS; y++) {
      for (x = 0; x < COLS; x++) {
        if (snake.some(function (s) { return s.x === x && s.y === y; })) continue;
        if (obstacles.some(function (o) { return o.x === x && o.y === y; })) continue;
        free.push({ x: x, y: y });
      }
    }
    food = free.length ? free[(Math.random() * free.length) | 0] : null;
  }

  function spawnObstacle() {
    var cfg = DIFFS[diff];
    if (!cfg.obstacles || obstacles.length >= cfg.obstacles) return;
    var free = [], x, y;
    for (y = 0; y < ROWS; y++) {
      for (x = 0; x < COLS; x++) {
        if (snake.some(function (s) { return s.x === x && s.y === y; })) continue;
        if (food && food.x === x && food.y === y) continue;
        if (obstacles.some(function (o) { return o.x === x && o.y === y; })) continue;
        if (Math.abs(x - snake[0].x) + Math.abs(y - snake[0].y) < 4) continue;
        free.push({ x: x, y: y });
      }
    }
    if (!free.length) return;
    obstacles.push(free[(Math.random() * free.length) | 0]);
  }

  function syncHud() {
    elScore.textContent = String(score);
    elBest.textContent = String(bestFor(diff));
    best = bestFor(diff);
    elLv.textContent = String(levelForScore(eaten) + 1);
    elLvLabel.textContent = DIFFS[diff].label + ' · LV';
    syncTimer();
  }

  // 奖励果倒计时：基础 10s，每 2 个速度档位 -1s，困难再 -1s，最短 4s
  function bonusTtlMs() {
    var lv = levelForScore(eaten);
    var sec = BONUS_TTL_BASE - Math.floor(lv / 2) - (diff === 'hard' ? 1 : 0);
    if (sec < BONUS_TTL_MIN) sec = BONUS_TTL_MIN;
    return sec * 1000;
  }

  function syncTimer() {
    var txt = bonus ? Math.max(0, Math.ceil(bonus.ms / 1000)) + 's' : '--';
    if (txt === timerText) return;
    timerText = txt;
    elTimer.textContent = txt;
    elTimer.classList.toggle('is-on', !!bonus);
  }

  function spawnBonus() {
    if (bonus) return;                       // 上一颗还在，这轮跳过
    var free = [], x, y;
    for (y = 0; y < ROWS; y++) {
      for (x = 0; x < COLS; x++) {
        if (snake.some(function (s) { return s.x === x && s.y === y; })) continue;
        if (food && food.x === x && food.y === y) continue;
        if (obstacles.some(function (o) { return o.x === x && o.y === y; })) continue;
        if (Math.abs(x - snake[0].x) + Math.abs(y - snake[0].y) < 3) continue;
        free.push({ x: x, y: y });
      }
    }
    if (!free.length) return;
    var cell = free[(Math.random() * free.length) | 0];
    bonus = { x: cell.x, y: cell.y, ms: bonusTtlMs() };
    syncTimer();
  }

  function levelForScore(s) {
    var level = 0, need = 0, i = 0;
    while (level < 99) {
      need += i < TIER_GAPS.length ? TIER_GAPS[i] : 1;
      if (s < need) return level;
      level++;
      i++;
    }
    return level;
  }

  function tickFor(s) {
    var cfg = DIFFS[diff];
    return Math.max(cfg.min, cfg.base - levelForScore(s) * cfg.step);
  }

  function turn(nx, ny) {
    var base = queue.length ? queue[queue.length - 1] : dir;
    if (nx === -base.x && ny === -base.y) return;
    if (nx === base.x && ny === base.y) return;
    if (queue.length < 2) queue.push({ x: nx, y: ny });
  }

  function step() {
    if (queue.length) dir = queue.shift();

    var head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    if (head.x < 0 || head.y < 0 || head.x >= COLS || head.y >= ROWS) { die(); return; }

    var hitBlock = obstacles.some(function (o) { return o.x === head.x && o.y === head.y; });
    if (hitBlock) { die(); return; }

    var eating = !!food && head.x === food.x && head.y === food.y;
    var taking = !!bonus && head.x === bonus.x && head.y === bonus.y;
    var growing = eating || taking;
    var body = growing ? snake : snake.slice(0, snake.length - 1);
    var hitSelf = body.some(function (s) { return s.x === head.x && s.y === head.y; });
    if (hitSelf) { die(); return; }

    snake.unshift(head);

    if (eating) {
      eaten++;
      score++;
      tick = tickFor(eaten);
      submitScore();
      placeFood();
      if (eaten % 6 === 0) spawnObstacle();
      if (eaten % BONUS_EVERY === 0) spawnBonus();
      syncHud();
      try { if (navigator.vibrate) navigator.vibrate(8); } catch (e) { /* 不支持震动时忽略 */ }
    } else if (taking) {
      score += 5;                    // 只加分，不动速度档位
      bonus = null;
      submitScore();
      syncHud();
      try { if (navigator.vibrate) navigator.vibrate([6, 30, 6]); } catch (e) { /* 忽略 */ }
    } else {
      snake.pop();
    }
  }

  function die() {
    alive = false;
    running = false;
    submitScore();
    newRecord = score > 0 && score > bestAtStart;
    bonus = null;
    syncHud();

    stage.classList.remove('shake');
    void stage.offsetWidth;
    stage.classList.add('shake');
    flash.classList.remove('on');
    void flash.offsetWidth;
    flash.classList.add('on');

    showOverlay('over');
  }

  function draw(t) {
    var now = t || 0, i, s, px, py, x, y;

    ctx.fillStyle = '#060a07';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = '#0d1710';
    for (y = 0; y < ROWS; y++) {
      for (x = 0; x < COLS; x++) {
        ctx.fillRect(x * CELL + CELL / 2 - 1, y * CELL + CELL / 2 - 1, 2, 2);
      }
    }

    if (food) {
      var pulse = 1 + Math.sin(now / 200) * 1.5;
      px = food.x * CELL;
      py = food.y * CELL;
      ctx.fillStyle = 'rgba(255, 46, 77, 0.14)';
      ctx.fillRect(px - pulse, py - pulse, CELL + pulse * 2, CELL + pulse * 2);
      ctx.fillStyle = '#ff2e4d';
      ctx.fillRect(px + 2, py + 2, CELL - 4, CELL - 4);
      ctx.fillStyle = 'rgba(255, 235, 240, 0.6)';
      ctx.fillRect(px + 4, py + 4, 3, 3);
    }

    if (bonus) {
      var bp = 1 + Math.sin(now / 140) * 1.2;
      px = bonus.x * CELL;
      py = bonus.y * CELL;
      ctx.fillStyle = 'rgba(255, 217, 61, 0.18)';
      ctx.fillRect(px - bp, py - bp, CELL + bp * 2, CELL + bp * 2);
      ctx.fillStyle = '#ffd93d';
      ctx.fillRect(px + 5, py + 2, 6, CELL - 4);
      ctx.fillRect(px + 2, py + 5, CELL - 4, 6);
      ctx.fillStyle = '#fffbe0';
      ctx.fillRect(px + 7, py + 7, 2, 2);
    }

    for (i = 0; i < obstacles.length; i++) {
      px = obstacles[i].x * CELL;
      py = obstacles[i].y * CELL;
      ctx.fillStyle = 'rgba(255, 46, 77, 0.12)';
      ctx.fillRect(px, py, CELL, CELL);
      ctx.strokeStyle = 'rgba(255, 46, 77, 0.8)';
      ctx.lineWidth = 1;
      ctx.strokeRect(px + 2.5, py + 2.5, CELL - 5, CELL - 5);
      ctx.strokeStyle = 'rgba(255, 46, 77, 0.55)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(px + 5, py + 5); ctx.lineTo(px + CELL - 5, py + CELL - 5);
      ctx.moveTo(px + CELL - 5, py + 5); ctx.lineTo(px + 5, py + CELL - 5);
      ctx.stroke();
    }

    for (i = snake.length - 1; i >= 0; i--) {
      s = snake[i];
      px = s.x * CELL;
      py = s.y * CELL;
      if (i === 0) ctx.fillStyle = '#8dffab';
      else ctx.fillStyle = (i / snake.length) < 0.55 ? '#3dff6e' : '#1fae46';
      ctx.fillRect(px, py, CELL, CELL);
      ctx.fillStyle = 'rgba(4, 12, 7, 0.32)';
      ctx.fillRect(px, py, CELL, 1);
      ctx.fillRect(px, py, 1, CELL);
    }

    var hx = snake[0].x * CELL, hy = snake[0].y * CELL, e1, e2;
    if (dir.x !== 0) {
      var exx = hx + (dir.x > 0 ? CELL - 6 : 3);
      e1 = [exx, hy + 3];
      e2 = [exx, hy + CELL - 6];
    } else {
      var eyy = hy + (dir.y > 0 ? CELL - 6 : 3);
      e1 = [hx + 3, eyy];
      e2 = [hx + CELL - 6, eyy];
    }
    ctx.fillStyle = '#04160b';
    ctx.fillRect(e1[0], e1[1], 3, 3);
    ctx.fillRect(e2[0], e2[1], 3, 3);
  }

  var last = 0, acc = 0;

  function frame(t) {
    requestAnimationFrame(frame);
    draw(t);
    if (!running || !alive) { last = t; return; }
    if (!last) last = t;
    var dt = t - last;
    last = t;
    if (dt > 200) dt = tick;
    if (bonus) {
      bonus.ms -= dt;
      if (bonus.ms <= 0) { bonus = null; syncTimer(); } else { syncTimer(); }
    }
    acc += dt;
    while (acc >= tick && alive) { acc -= tick; step(); }
  }

  function showOverlay(kind) {
    overlayMode = kind;
    ovScores.hidden = true;
    ovBadge.hidden = true;
    ovInstall.hidden = kind !== 'start';
    diffBox.hidden = kind === 'pause';

    if (kind === 'start') {
      // 开始页不显示上一局的计时
      timerText = '';
      bonus = null;
      syncTimer();
    }

    if (kind === 'pause') {
      ovTitle.textContent = '已暂停';
      ovTip.textContent = '休息一下，随时继续';
      ovBtn.textContent = '继续';
    } else if (kind === 'start') {
      ovTitle.textContent = '贪吃蛇';
      ovTip.innerHTML = '红果 +1 分并<b>加速</b> · 限时黄块 +5 分（不加速）<br />点棋盘暂停 · 环形键 / 滑动 / 方向键';
      ovBtn.textContent = '开始游戏';
    } else {
      ovTitle.textContent = '游戏结束';
      ovTip.textContent = '再来一局，看看能到几分';
      ovScore.textContent = String(score);
      ovBest.textContent = String(best);
      ovScores.hidden = false;
      ovBadge.hidden = !newRecord;
      ovBtn.textContent = '再来一局';
    }
    overlay.classList.add('is-open');
  }

  function start() {
    reset();
    running = true;
    alive = true;
    last = 0;
    acc = 0;
    overlayMode = '';
    overlay.classList.remove('is-open');
    draw();
  }

  function pause() {
    if (!running || !alive) return;
    running = false;
    clearKeys();
    showOverlay('pause');
  }

  function resume() {
    if (!alive) return;
    running = true;
    last = 0;
    acc = 0;
    overlayMode = '';
    overlay.classList.remove('is-open');
    draw();
  }

  function clearKeys() {
    Array.prototype.forEach.call(document.querySelectorAll('.ring .sec'), function (el) {
      el.classList.remove('is-down');
    });
  }

  var KEYS = {
    ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0],
    KeyW: [0, -1], KeyS: [0, 1], KeyA: [-1, 0], KeyD: [1, 0]
  };

  window.addEventListener('keydown', function (e) {
    var k = KEYS[e.code];
    if (k) {
      e.preventDefault();
      if (running && alive) turn(k[0], k[1]);
      return;
    }
    if (e.code === 'Space' || e.code === 'Enter') {
      e.preventDefault();
      if (!alive) start();
      else if (running) pause();
      else resume();
    }
  });

  // ---- 环形四分方向键 ----
  var SVG_NS = 'http://www.w3.org/2000/svg';
  var RING_OUT = 95, RING_IN = 46, RING_GAP = 8;
  var DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
  var DIR_ANGLE = { up: -90, right: 0, down: 90, left: 180 };

  function polar(deg, radius) {
    var a = deg * Math.PI / 180;
    return [100 + radius * Math.cos(a), 100 + radius * Math.sin(a)];
  }
  function fmt(n) { return n.toFixed(2); }
  function sectorPath(center, R, r) {
    var half = 45 - RING_GAP / 2;
    var p1 = polar(center - half, R), p2 = polar(center + half, R);
    var p3 = polar(center + half, r), p4 = polar(center - half, r);
    return 'M' + fmt(p1[0]) + ' ' + fmt(p1[1]) +
      'A' + R + ' ' + R + ' 0 0 1 ' + fmt(p2[0]) + ' ' + fmt(p2[1]) +
      'L' + fmt(p3[0]) + ' ' + fmt(p3[1]) +
      'A' + r + ' ' + r + ' 0 0 0 ' + fmt(p4[0]) + ' ' + fmt(p4[1]) + 'Z';
  }
  function arrowPath(center, R, r) {
    var mid = (R + r) / 2, size = 12;
    var ux = Math.cos(center * Math.PI / 180), uy = Math.sin(center * Math.PI / 180);
    var px = -uy, py = ux;
    var c = polar(center, mid);
    var tip = [c[0] + ux * size, c[1] + uy * size];
    var b1 = [c[0] - ux * size * 0.5 + px * size * 0.72, c[1] - uy * size * 0.5 + py * size * 0.72];
    var b2 = [c[0] - ux * size * 0.5 - px * size * 0.72, c[1] - uy * size * 0.5 - py * size * 0.72];
    return 'M' + fmt(tip[0]) + ' ' + fmt(tip[1]) +
      'L' + fmt(b1[0]) + ' ' + fmt(b1[1]) +
      'L' + fmt(b2[0]) + ' ' + fmt(b2[1]) + 'Z';
  }
  function svgNode(name, attrs) {
    var el = document.createElementNS(SVG_NS, name);
    for (var k in attrs) el.setAttribute(k, attrs[k]);
    return el;
  }

  var ringSvg = document.getElementById('ring');
  ['up', 'right', 'down', 'left'].forEach(function (name) {
    var sec = svgNode('path', { class: 'sec', d: sectorPath(DIR_ANGLE[name], RING_OUT, RING_IN), 'data-dir': name });
    sec.addEventListener('pointerdown', function (e) {
      e.preventDefault();
      sec.classList.add('is-down');
      if (running && alive) turn(DIRS[name][0], DIRS[name][1]);
    });
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (ev) {
      sec.addEventListener(ev, function () { sec.classList.remove('is-down'); });
    });
    ringSvg.appendChild(sec);
    ringSvg.appendChild(svgNode('path', { class: 'arrow', d: arrowPath(DIR_ANGLE[name], RING_OUT, RING_IN) }));
  });
  ringSvg.appendChild(svgNode('circle', { class: 'hub', cx: 100, cy: 100, r: RING_IN - 6 }));
  ringSvg.appendChild(svgNode('circle', { class: 'hub-dot', cx: 100, cy: 100, r: 3 }));

  // ---- 棋盘上：滑动转向，点一下暂停 ----
  var sx = 0, sy = 0, dragging = false;
  canvas.addEventListener('pointerdown', function (e) {
    dragging = true;
    sx = e.clientX;
    sy = e.clientY;
  });
  canvas.addEventListener('pointerup', function (e) {
    if (!dragging) return;
    dragging = false;
    if (!running || !alive) return;
    var dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.abs(dx) < 18 && Math.abs(dy) < 18) { pause(); return; }
    if (Math.abs(dx) > Math.abs(dy)) turn(dx > 0 ? 1 : -1, 0);
    else turn(0, dy > 0 ? 1 : -1);
  });

  document.addEventListener('visibilitychange', function () {
    if (document.hidden) pause();
  });

  function loadDiff() {
    try {
      var v = localStorage.getItem(DIFF_KEY);
      if (v && DIFFS[v]) return v;
    } catch (e) { /* 隐私模式下忽略 */ }
    return 'normal';
  }
  function saveDiff(k) {
    try { localStorage.setItem(DIFF_KEY, k); } catch (e) { /* 忽略 */ }
  }
  function applyDiffUI() {
    Array.prototype.forEach.call(diffBox.querySelectorAll('.diff-opt'), function (b) {
      b.classList.toggle('is-active', b.getAttribute('data-diff') === diff);
    });
    diffDesc.textContent = DIFFS[diff].desc;
    syncHud();
  }
  diffBox.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('.diff-opt') : null;
    if (!b) return;
    var k = b.getAttribute('data-diff');
    if (!DIFFS[k] || k === diff) return;
    diff = k;
    saveDiff(k);
    best = bestFor(k);
    applyDiffUI();
    if (!running) { reset(); draw(); }
  });

  ovBtn.addEventListener('click', function () {
    if (overlayMode === 'pause') resume();
    else start();
  });

  reset();
  applyDiffUI();
  draw();
  requestAnimationFrame(frame);

  // 注册 Service Worker：仅 https / localhost 可用，直连 file:// 或局域网 http 时静默跳过
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () { /* 非安全上下文，忽略 */ });
    });
  }

  // 调试钩子，仅 ?dev=1 时可用（自动化测试用，正常游玩不受影响）
  if (/[?&]dev=1/.test(location.search)) {
    window.__dev = {
      state: function () {
        return {
          snake: snake.slice(), food: food, score: score, best: best,
          alive: alive, running: running, tick: tick, dir: { x: dir.x, y: dir.y },
          obstacles: obstacles.slice(), diff: diff,
          eaten: eaten, bonus: bonus, bestByDiff: { normal: bestFor('normal'), hard: bestFor('hard') }
        };
      },
      placeFoodAt: function (x, y) { food = { x: x, y: y }; },
      placeObstacleAt: function (x, y) { obstacles.push({ x: x, y: y }); },
      placeBonusAt: function (x, y) { bonus = { x: x, y: y, ms: bonusTtlMs() }; syncTimer(); },
      spawnBonus: spawnBonus,
      bonusTtlMs: bonusTtlMs,
      levelForScore: levelForScore,
      tickFor: tickFor,
      step: step,
      start: start
    };
  }
})();
</script>
</body>
</html>
