<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#060a07" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="贪吃蛇" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png" />
<title>像素贪吃蛇</title>
<style>
  :root {
    --bg: #060a07;
    --panel: #0b1310;
    --line: #1d3026;
    --neon: #3dff6e;
    --neon-2: #22c24e;
    --food: #ff2e4d;
    --text: #b6d6c1;
    --text-dim: #587a65;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--text);
    font-family: ui-monospace, "SFMono-Regular", "Cascadia Mono", Consolas, monospace;
    user-select: none; -webkit-user-select: none;
    touch-action: none; overscroll-behavior: none;
  }
  .app {
    height: 100%; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px;
    padding: max(12px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom));
  }
  .hud {
    width: min(88vw, 400px); display: flex; justify-content: space-between; align-items: flex-end;
    padding-bottom: 2px; border-bottom: 1px solid var(--line);
  }
  .stat { display: flex; flex-direction: column; gap: 5px; }
  .stat .label { font-size: 10px; letter-spacing: 3px; color: var(--text-dim); }
  .stat .value {
    font-size: 28px; font-weight: 700; line-height: 1; color: var(--neon);
    text-shadow: 0 0 12px rgba(61, 255, 110, 0.45);
  }
  .stat.right { text-align: right; }
  .stage { position: relative; will-change: transform; }
  .stage.shake { animation: shake 0.32s steps(2, end); }
  @keyframes shake {
    0% { transform: translate(0, 0); }
    30% { transform: translate(-4px, 3px); }
    60% { transform: translate(4px, -2px); }
    100% { transform: translate(0, 0); }
  }
  canvas {
    display: block; width: min(88vw, 44vh, 400px); height: auto;
    image-rendering: pixelated; image-rendering: crisp-edges;
    border: 1px solid var(--line); background: var(--bg);
    box-shadow: 0 0 0 1px rgba(61, 255, 110, 0.06), 0 0 26px rgba(61, 255, 110, 0.10);
  }
  .hint { margin: 0; font-size: 11px; letter-spacing: 1px; color: var(--text-dim); }
  .pad {
    display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr);
    gap: 8px; width: min(62vw, 214px); aspect-ratio: 1;
  }
  .key {
    display: flex; align-items: center; justify-content: center; padding: 0;
    font: inherit; font-size: 17px; color: var(--neon); background: var(--panel);
    border: 1px solid var(--line); border-radius: 3px; cursor: pointer;
    touch-action: none; transition: background 0.06s, border-color 0.06s, box-shadow 0.06s;
  }
  .key.is-down {
    background: rgba(61, 255, 110, 0.16); border-color: var(--neon);
    box-shadow: 0 0 14px rgba(61, 255, 110, 0.28) inset;
  }
  .key.up { grid-area: 1 / 2; }
  .key.left { grid-area: 2 / 1; }
  .key.right { grid-area: 2 / 3; }
  .key.down { grid-area: 3 / 2; }
  .key.center { grid-area: 2 / 2; font-size: 11px; letter-spacing: 1px; color: var(--text-dim); }
  .overlay {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(3, 6, 4, 0.86); z-index: 20; padding: 24px;
  }
  .overlay.is-open { display: flex; }
  .panel { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 14px; }
  .title {
    margin: 0; font-size: 30px; letter-spacing: 8px; color: var(--neon);
    text-shadow: 0 0 18px rgba(61, 255, 110, 0.55), 3px 3px 0 rgba(34, 194, 78, 0.35);
  }
  .tip { margin: 0; font-size: 12px; line-height: 1.9; color: var(--text-dim); letter-spacing: 1px; }
  .tip.small { font-size: 10px; letter-spacing: 0.5px; color: #4d7a5f; max-width: 250px; }
  .tip b { color: var(--text); font-weight: 400; }
  .scoreline { display: flex; gap: 22px; font-size: 12px; letter-spacing: 2px; color: var(--text-dim); }
  .scoreline span b { color: var(--neon); font-size: 20px; margin-left: 6px; }
  .badge {
    font-size: 10px; letter-spacing: 3px; padding: 4px 10px; color: #04150a;
    background: var(--neon); box-shadow: 0 0 16px rgba(61, 255, 110, 0.5);
  }
  .btn {
    margin-top: 4px; padding: 14px 36px; font: inherit; font-size: 15px; letter-spacing: 5px;
    color: #04150a; background: var(--neon); border: 0; border-radius: 2px; cursor: pointer;
    box-shadow: 0 0 22px rgba(61, 255, 110, 0.45);
  }
  .btn:active { transform: translateY(1px); box-shadow: 0 0 8px rgba(61, 255, 110, 0.5); }
  .flash {
    position: fixed; inset: 0; background: rgba(255, 46, 77, 0.18);
    opacity: 0; pointer-events: none; z-index: 15;
  }
  .flash.on { animation: flash 0.38s ease-out; }
  @keyframes flash { 0% { opacity: 1; } 100% { opacity: 0; } }
</style>
</head>
<body>
<div class="app">
  <header class="hud">
    <div class="stat"><span class="label">SCORE</span><span class="value" id="score">0</span></div>
    <div class="stat right"><span class="label">BEST</span><span class="value" id="best">0</span></div>
  </header>
  <main class="stage">
    <canvas id="board" width="320" height="320"></canvas>
  </main>
  <p class="hint">撞墙即死 · 方向键 / WASD / 屏幕按键</p>
  <nav class="pad" id="pad">
    <button class="key up" data-dir="up" aria-label="向上">▲</button>
    <button class="key left" data-dir="left" aria-label="向左">◀</button>
    <button class="key center" id="pauseBtn" aria-label="暂停">II</button>
    <button class="key right" data-dir="right" aria-label="向右">▶</button>
    <button class="key down" data-dir="down" aria-label="向下">▼</button>
  </nav>
</div>

<div class="flash" id="flash"></div>

<div class="overlay is-open" id="overlay">
  <div class="panel">
    <h1 class="title" id="ovTitle">贪吃蛇</h1>
    <p class="tip" id="ovTip">撞墙即死 · 吃到食物变长并<b>加速</b><br />方向键 / WASD / 屏幕方向键</p>
    <div class="scoreline" id="ovScores" hidden>
      <span>本局<b id="ovScore">0</b></span>
      <span>最高<b id="ovBest">0</b></span>
    </div>
    <div class="badge" id="ovBadge" hidden>新纪录</div>
    <button class="btn" id="ovBtn">开始游戏</button>
    <p class="tip small" id="ovInstall">浏览器菜单 →「安装应用」或「添加到主屏幕」，即可离线全屏游玩</p>
  </div>
</div>

<script>
(function () {
  'use strict';

  var COLS = 20, ROWS = 20, CELL = 16;
  var BASE_TICK = 140, MIN_TICK = 62, ACCEL = 6;
  var STORE_KEY = 'snake.best.v1';

  var canvas = document.getElementById('board');
  var ctx = canvas.getContext('2d');
  canvas.width = COLS * CELL;
  canvas.height = ROWS * CELL;

  var elScore = document.getElementById('score');
  var elBest = document.getElementById('best');
  var overlay = document.getElementById('overlay');
  var ovTitle = document.getElementById('ovTitle');
  var ovTip = document.getElementById('ovTip');
  var ovScores = document.getElementById('ovScores');
  var ovScore = document.getElementById('ovScore');
  var ovBest = document.getElementById('ovBest');
  var ovBadge = document.getElementById('ovBadge');
  var ovBtn = document.getElementById('ovBtn');
  var ovInstall = document.getElementById('ovInstall');
  var flash = document.getElementById('flash');
  var stage = document.querySelector('.stage');

  var snake, dir, queue, food, score, tick, alive, running, best;
  var overlayMode = 'start';

  best = loadBest();

  function loadBest() {
    try { return parseInt(localStorage.getItem(STORE_KEY) || '0', 10) || 0; } catch (e) { return 0; }
  }
  function saveBest(v) {
    try { localStorage.setItem(STORE_KEY, String(v)); } catch (e) { /* 隐私模式下忽略 */ }
  }

  function reset() {
    snake = [{ x: 8, y: 10 }, { x: 7, y: 10 }, { x: 6, y: 10 }];
    dir = { x: 1, y: 0 };
    queue = [];
    score = 0;
    tick = BASE_TICK;
    alive = true;
    placeFood();
    syncHud();
  }

  function placeFood() {
    var free = [], x, y;
    for (y = 0; y < ROWS; y++) {
      for (x = 0; x < COLS; x++) {
        if (!snake.some(function (s) { return s.x === x && s.y === y; })) free.push({ x: x, y: y });
      }
    }
    food = free.length ? free[(Math.random() * free.length) | 0] : null;
  }

  function syncHud() {
    elScore.textContent = String(score);
    elBest.textContent = String(best);
  }

  function turn(nx, ny) {
    var base = queue.length ? queue[queue.length - 1] : dir;
    if (nx === -base.x && ny === -base.y) return;
    if (nx === base.x && ny === base.y) return;
    if (queue.length < 2) queue.push({ x: nx, y: ny });
  }

  function step() {
    if (queue.length) dir = queue.shift();

    var head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    if (head.x < 0 || head.y < 0 || head.x >= COLS || head.y >= ROWS) { die(); return; }

    var eating = !!food && head.x === food.x && head.y === food.y;
    var body = eating ? snake : snake.slice(0, snake.length - 1);
    var hitSelf = body.some(function (s) { return s.x === head.x && s.y === head.y; });
    if (hitSelf) { die(); return; }

    snake.unshift(head);

    if (eating) {
      score++;
      tick = Math.max(MIN_TICK, BASE_TICK - score * ACCEL);
      if (score > best) { best = score; saveBest(best); }
      placeFood();
      syncHud();
      try { if (navigator.vibrate) navigator.vibrate(8); } catch (e) { /* 不支持震动时忽略 */ }
    } else {
      snake.pop();
    }
  }

  function die() {
    alive = false;
    running = false;
    if (score > best) { best = score; saveBest(best); }
    syncHud();

    stage.classList.remove('shake');
    void stage.offsetWidth;
    stage.classList.add('shake');
    flash.classList.remove('on');
    void flash.offsetWidth;
    flash.classList.add('on');

    showOverlay('over');
  }

  function draw(t) {
    var now = t || 0, i, s, px, py, x, y;

    ctx.fillStyle = '#060a07';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = '#0d1710';
    for (y = 0; y < ROWS; y++) {
      for (x = 0; x < COLS; x++) {
        ctx.fillRect(x * CELL + CELL / 2 - 1, y * CELL + CELL / 2 - 1, 2, 2);
      }
    }

    if (food) {
      var pulse = 1 + Math.sin(now / 200) * 1.5;
      px = food.x * CELL;
      py = food.y * CELL;
      ctx.fillStyle = 'rgba(255, 46, 77, 0.14)';
      ctx.fillRect(px - pulse, py - pulse, CELL + pulse * 2, CELL + pulse * 2);
      ctx.fillStyle = '#ff2e4d';
      ctx.fillRect(px + 2, py + 2, CELL - 4, CELL - 4);
      ctx.fillStyle = 'rgba(255, 235, 240, 0.6)';
      ctx.fillRect(px + 4, py + 4, 3, 3);
    }

    for (i = snake.length - 1; i >= 0; i--) {
      s = snake[i];
      px = s.x * CELL;
      py = s.y * CELL;
      if (i === 0) ctx.fillStyle = '#8dffab';
      else ctx.fillStyle = (i / snake.length) < 0.55 ? '#3dff6e' : '#1fae46';
      ctx.fillRect(px, py, CELL, CELL);
      ctx.fillStyle = 'rgba(4, 12, 7, 0.32)';
      ctx.fillRect(px, py, CELL, 1);
      ctx.fillRect(px, py, 1, CELL);
    }

    var hx = snake[0].x * CELL, hy = snake[0].y * CELL, e1, e2;
    if (dir.x !== 0) {
      var exx = hx + (dir.x > 0 ? CELL - 6 : 3);
      e1 = [exx, hy + 3];
      e2 = [exx, hy + CELL - 6];
    } else {
      var eyy = hy + (dir.y > 0 ? CELL - 6 : 3);
      e1 = [hx + 3, eyy];
      e2 = [hx + CELL - 6, eyy];
    }
    ctx.fillStyle = '#04160b';
    ctx.fillRect(e1[0], e1[1], 3, 3);
    ctx.fillRect(e2[0], e2[1], 3, 3);
  }

  var last = 0, acc = 0;

  function frame(t) {
    requestAnimationFrame(frame);
    draw(t);
    if (!running || !alive) { last = t; return; }
    if (!last) last = t;
    var dt = t - last;
    last = t;
    if (dt > 200) dt = tick;
    acc += dt;
    while (acc >= tick && alive) { acc -= tick; step(); }
  }

  function showOverlay(kind) {
    overlayMode = kind;
    ovScores.hidden = true;
    ovBadge.hidden = true;
    ovInstall.hidden = kind !== 'start';

    if (kind === 'pause') {
      ovTitle.textContent = '已暂停';
      ovTip.textContent = '休息一下，随时继续';
      ovBtn.textContent = '继续';
    } else if (kind === 'start') {
      ovTitle.textContent = '贪吃蛇';
      ovTip.innerHTML = '撞墙即死 · 吃到食物变长并<b>加速</b><br />方向键 / WASD / 屏幕方向键';
      ovBtn.textContent = '开始游戏';
    } else {
      ovTitle.textContent = '游戏结束';
      ovTip.textContent = '再来一局，看看能到几分';
      ovScore.textContent = String(score);
      ovBest.textContent = String(best);
      ovScores.hidden = false;
      ovBadge.hidden = !(score > 0 && score >= best);
      ovBtn.textContent = '再来一局';
    }
    overlay.classList.add('is-open');
  }

  function start() {
    reset();
    running = true;
    alive = true;
    last = 0;
    acc = 0;
    overlayMode = '';
    overlay.classList.remove('is-open');
    draw();
  }

  function pause() {
    if (!running || !alive) return;
    running = false;
    clearKeys();
    showOverlay('pause');
  }

  function resume() {
    if (!alive) return;
    running = true;
    last = 0;
    acc = 0;
    overlayMode = '';
    overlay.classList.remove('is-open');
    draw();
  }

  function clearKeys() {
    Array.prototype.forEach.call(document.querySelectorAll('.key'), function (el) {
      el.classList.remove('is-down');
    });
  }

  var KEYS = {
    ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0],
    KeyW: [0, -1], KeyS: [0, 1], KeyA: [-1, 0], KeyD: [1, 0]
  };

  window.addEventListener('keydown', function (e) {
    var k = KEYS[e.code];
    if (k) {
      e.preventDefault();
      if (running && alive) turn(k[0], k[1]);
      return;
    }
    if (e.code === 'Space' || e.code === 'Enter') {
      e.preventDefault();
      if (!alive) start();
      else if (running) pause();
      else resume();
    }
  });

  // ---- 屏幕方向键 ----
  var DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
  var pad = document.getElementById('pad');

  function bindKey(el, name) {
    el.addEventListener('pointerdown', function (e) {
      e.preventDefault();
      el.classList.add('is-down');
      if (name === 'pause') { pause(); return; }
      if (running && alive) turn(DIRS[name][0], DIRS[name][1]);
    });
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (ev) {
      el.addEventListener(ev, function () { el.classList.remove('is-down'); });
    });
  }
  Array.prototype.forEach.call(pad.querySelectorAll('[data-dir]'), function (el) {
    bindKey(el, el.getAttribute('data-dir'));
  });
  bindKey(document.getElementById('pauseBtn'), 'pause');

  // ---- 棋盘上滑动转向 ----
  var sx = 0, sy = 0, dragging = false;
  canvas.addEventListener('pointerdown', function (e) {
    dragging = true;
    sx = e.clientX;
    sy = e.clientY;
  });
  canvas.addEventListener('pointerup', function (e) {
    if (!dragging) return;
    dragging = false;
    if (!running || !alive) return;
    var dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.abs(dx) < 18 && Math.abs(dy) < 18) return;
    if (Math.abs(dx) > Math.abs(dy)) turn(dx > 0 ? 1 : -1, 0);
    else turn(0, dy > 0 ? 1 : -1);
  });

  document.addEventListener('visibilitychange', function () {
    if (document.hidden) pause();
  });

  ovBtn.addEventListener('click', function () {
    if (overlayMode === 'pause') resume();
    else start();
  });

  reset();
  draw();
  requestAnimationFrame(frame);

  // 注册 Service Worker：仅 https / localhost 可用，直连 file:// 或局域网 http 时静默跳过
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () { /* 非安全上下文，忽略 */ });
    });
  }

  // 调试钩子，仅 ?dev=1 时可用（自动化测试用，正常游玩不受影响）
  if (/[?&]dev=1/.test(location.search)) {
    window.__dev = {
      state: function () {
        return {
          snake: snake.slice(), food: food, score: score, best: best,
          alive: alive, running: running, tick: tick, dir: { x: dir.x, y: dir.y }
        };
      },
      placeFoodAt: function (x, y) { food = { x: x, y: y }; },
      step: step,
      start: start
    };
  }
})();
</script>
</body>
</html>
