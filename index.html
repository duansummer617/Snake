<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#070b08" />
<title>像素贪吃蛇</title>
<style>
  :root {
    --bg: #070b08;
    --panel: #0c1210;
    --line: #1b2a20;
    --neon: #38e558;
    --neon-dim: #1d7a33;
    --food: #ff3355;
    --text: #b9d4c2;
    --text-dim: #5f7a68;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--text);
    font-family: ui-monospace, "SFMono-Regular", "Cascadia Mono", Consolas, monospace;
    user-select: none; -webkit-user-select: none;
    touch-action: none; overscroll-behavior: none;
  }
  .app {
    height: 100%; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    padding: max(12px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom));
  }
  .hud { width: min(92vw, 420px); display: flex; justify-content: space-between; align-items: flex-end; }
  .stat { display: flex; flex-direction: column; gap: 4px; }
  .stat .label { font-size: 11px; letter-spacing: 2px; color: var(--text-dim); }
  .stat .value { font-size: 26px; font-weight: 700; color: var(--neon); line-height: 1; }
  .stage { position: relative; }
  canvas {
    display: block; width: min(92vw, 70vh, 420px); height: auto;
    image-rendering: pixelated; image-rendering: crisp-edges;
    border: 2px solid var(--line); border-radius: 4px;
    background: var(--bg);
  }
  .hint { font-size: 12px; letter-spacing: 1px; color: var(--text-dim); }
  .overlay {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(4, 8, 6, 0.82); backdrop-filter: blur(2px); z-index: 10;
    padding: 24px;
  }
  .overlay.is-open { display: flex; }
  .panel { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 16px; }
  .title { margin: 0; font-size: 30px; letter-spacing: 6px; color: var(--neon); }
  .tip { margin: 0; font-size: 13px; line-height: 1.8; color: var(--text-dim); white-space: pre-line; }
  .btn {
    margin-top: 6px; padding: 14px 34px; font: inherit; font-size: 15px; letter-spacing: 4px;
    color: var(--bg); background: var(--neon); border: 0; border-radius: 3px; cursor: pointer;
    box-shadow: 0 0 18px rgba(56, 229, 88, 0.45);
  }
  .btn:active { transform: translateY(1px); box-shadow: 0 0 6px rgba(56, 229, 88, 0.5); }
</style>
</head>
<body>
<div class="app">
  <header class="hud">
    <div class="stat"><span class="label">SCORE</span><span class="value" id="score">0</span></div>
    <div class="stat"><span class="label">BEST</span><span class="value" id="best">0</span></div>
  </header>
  <main class="stage">
    <canvas id="board" width="320" height="320"></canvas>
  </main>
  <p class="hint">方向键 / WASD 控制</p>
</div>

<div class="overlay is-open" id="overlay">
  <div class="panel">
    <h1 class="title" id="ovTitle">贪吃蛇</h1>
    <p class="tip" id="ovTip">撞墙即死 · 吃到食物变长并加速</p>
    <button class="btn" id="ovBtn">开始游戏</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  var COLS = 20, ROWS = 20, CELL = 16;
  var BASE_TICK = 140, MIN_TICK = 62, ACCEL = 6;
  var STORE_KEY = 'snake.best.v1';

  var canvas = document.getElementById('board');
  var ctx = canvas.getContext('2d');
  canvas.width = COLS * CELL;
  canvas.height = ROWS * CELL;

  var elScore = document.getElementById('score');
  var elBest = document.getElementById('best');
  var overlay = document.getElementById('overlay');
  var ovTitle = document.getElementById('ovTitle');
  var ovTip = document.getElementById('ovTip');
  var ovBtn = document.getElementById('ovBtn');

  var snake, dir, queue, food, score, tick, alive, running, best;

  best = loadBest();

  function loadBest() {
    try { return parseInt(localStorage.getItem(STORE_KEY) || '0', 10) || 0; } catch (e) { return 0; }
  }
  function saveBest(v) {
    try { localStorage.setItem(STORE_KEY, String(v)); } catch (e) { /* 隐私模式下忽略 */ }
  }

  function reset() {
    snake = [{ x: 8, y: 10 }, { x: 7, y: 10 }, { x: 6, y: 10 }];
    dir = { x: 1, y: 0 };
    queue = [];
    score = 0;
    tick = BASE_TICK;
    alive = true;
    placeFood();
    syncHud();
  }

  function placeFood() {
    var free = [], x, y;
    for (y = 0; y < ROWS; y++) {
      for (x = 0; x < COLS; x++) {
        if (!snake.some(function (s) { return s.x === x && s.y === y; })) free.push({ x: x, y: y });
      }
    }
    food = free.length ? free[(Math.random() * free.length) | 0] : null;
  }

  function syncHud() {
    elScore.textContent = String(score);
    elBest.textContent = String(best);
  }

  function turn(nx, ny) {
    var base = queue.length ? queue[queue.length - 1] : dir;
    if (nx === -base.x && ny === -base.y) return;
    if (nx === base.x && ny === base.y) return;
    if (queue.length < 2) queue.push({ x: nx, y: ny });
  }

  function step() {
    if (queue.length) dir = queue.shift();

    var head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    if (head.x < 0 || head.y < 0 || head.x >= COLS || head.y >= ROWS) { die(); return; }

    var eating = !!food && head.x === food.x && head.y === food.y;
    var body = eating ? snake : snake.slice(0, snake.length - 1);
    var hitSelf = body.some(function (s) { return s.x === head.x && s.y === head.y; });
    if (hitSelf) { die(); return; }

    snake.unshift(head);

    if (eating) {
      score++;
      tick = Math.max(MIN_TICK, BASE_TICK - score * ACCEL);
      if (score > best) { best = score; saveBest(best); }
      placeFood();
      syncHud();
      try { if (navigator.vibrate) navigator.vibrate(8); } catch (e) { /* 不支持震动时忽略 */ }
    } else {
      snake.pop();
    }
  }

  function die() {
    alive = false;
    running = false;
    if (score > best) { best = score; saveBest(best); }
    syncHud();
    showOverlay('over');
  }

  function draw() {
    var W = canvas.width, H = canvas.height, x, y, i, s;

    ctx.fillStyle = '#070b08';
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = '#0e1511';
    for (y = 0; y < ROWS; y++) {
      for (x = 0; x < COLS; x++) {
        ctx.fillRect(x * CELL + CELL / 2 - 1, y * CELL + CELL / 2 - 1, 2, 2);
      }
    }

    if (food) {
      ctx.fillStyle = '#ff3355';
      ctx.fillRect(food.x * CELL + 2, food.y * CELL + 2, CELL - 4, CELL - 4);
    }

    for (i = snake.length - 1; i >= 0; i--) {
      s = snake[i];
      ctx.fillStyle = i === 0 ? '#7dff9b' : '#38e558';
      ctx.fillRect(s.x * CELL + 1, s.y * CELL + 1, CELL - 2, CELL - 2);
    }
  }

  var last = 0, acc = 0;

  function frame(t) {
    requestAnimationFrame(frame);
    draw();
    if (!running || !alive) { last = t; return; }
    if (!last) last = t;
    var dt = t - last;
    last = t;
    if (dt > 200) dt = tick;
    acc += dt;
    while (acc >= tick && alive) { acc -= tick; step(); }
  }

  function showOverlay(kind) {
    if (kind === 'start') {
      ovTitle.textContent = '贪吃蛇';
      ovTip.textContent = '撞墙即死 · 吃到食物变长并加速';
      ovBtn.textContent = '开始游戏';
    } else {
      ovTitle.textContent = '游戏结束';
      ovTip.textContent = '本局得分 ' + score + '　最高 ' + best;
      ovBtn.textContent = '再来一局';
    }
    overlay.classList.add('is-open');
  }

  function start() {
    reset();
    running = true;
    alive = true;
    last = 0;
    acc = 0;
    overlay.classList.remove('is-open');
    draw();
  }

  var KEYS = {
    ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0],
    KeyW: [0, -1], KeyS: [0, 1], KeyA: [-1, 0], KeyD: [1, 0]
  };

  window.addEventListener('keydown', function (e) {
    var k = KEYS[e.code];
    if (k) {
      e.preventDefault();
      if (running && alive) turn(k[0], k[1]);
      return;
    }
    if (e.code === 'Space' || e.code === 'Enter') {
      e.preventDefault();
      if (!running || !alive) start();
    }
  });

  ovBtn.addEventListener('click', start);

  reset();
  draw();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
